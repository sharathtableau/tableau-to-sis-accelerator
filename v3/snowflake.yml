      - cx6_review.py
      - cx4_agent.py
      - cx5_repair.py
      - cx8_documents.py
      - v3_filter_states.py
      - v3_acceptance.py
      - v3_actions_proof.py

      - crosstab_plan.py

      - visual_plan_common.py

      - filter_plan.py

      - include_lod_plan.py
      - typed_include_expression.py
      - cortex_assist.py

      - tableau_server.py        # R1: pull a workbook from Tableau Server/Cloud by link

      - headless_render.py       # R8: render the app's own charts to PNG (no browser/SSO)

      - notebook_capture.py      # runs the generated app + Chromium INSIDE Snowflake

                                 # (container-runtime notebook on a compute pool). Still

                                 # the WORKSTATION path; NOT reachable from the deployed

                                 # app, which cannot call EXECUTE NOTEBOOK at all

      - task_capture.py          # the DEPLOYED app's capture path: enqueue a job and let

                                 # a Snowflake TASK run the notebook in its own execution

                                 # context (SiS sessions are blocked from EXECUTE NOTEBOOK

                                 # -- 0/8 vs 8/8 from a workstation, error 300002)

      - validation_jobs.py       # the shared queue contract both sides use

      - tableau_crosstab_jobs.py # R18: an isolated queue for the crosstab-fetch fallback

                                 # below -- its own table/stage subdir, never sharing

                                 # R15's own so iterating on this newer path can't risk

                                 # the already-working screenshot capture

      - tableau_crosstab_worker.py # R18: deploys/resumes the crosstab worker notebook

                                 # deep_validation.py calls when Tiers 1-5 (the REST

                                 # crosstab matcher) still leave a nested sheet

                                 # unresolved -- a genuine Tableau REST platform ceiling,

                                 # not a matching-logic gap (ARCHITECTURE.md S28)

      - tableau_zone_crosstab.py # R18: the actual browser-automation fetch (token-cookie

                                 # injection past SSO/MFA, real Download->Crosstab

                                 # dialog) -- not called directly by the SiS app, but

                                 # staged onto the worker notebook by

                                 # tableau_crosstab_worker.deploy_worker(), so it must

                                 # ship in this bundle to be available to stage from

      - capture_validation.py    # structural screenshot validation -- ONE implementation,

                                 # imported by the worker AND the tests (never copied)

      - app_screenshot.py        # real screenshot of the generated app (playwright import is

                                  # lazy -- available() reports unavailable in the SSO-gated

                                  # SiS sandbox at runtime, never at import time)

